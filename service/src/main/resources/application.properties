spring.datasource.url=${POSTGRESQL_DB_ADDRESS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRESQL_DB_USERNAME}
spring.datasource.password=${POSTGRESQL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/api

# JWT authentication (HS256). Real deployments override these values through the environment;
# the dummy default secret is for local development and tests only (must be >= 32 bytes).
jwt.secret=${JWT_SECRET:local-dev-secret-key-that-is-long-enough-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
