# Application name, overridable through the environment (used in logs and monitoring).
spring:
  application:
    name: ${PROJECT_NAME:BRS-Configurator}
  # Datasource credentials come from the dedicated variables of the CleverCloud PostgreSQL
  # add-on linked to the application, so no custom database variables are needed.
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_ADDON_HOST}:${POSTGRESQL_ADDON_PORT}/${POSTGRESQL_ADDON_DB}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRESQL_ADDON_USER}
    password: ${POSTGRESQL_ADDON_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    # default path /swagger-ui.html is used

# JWT authentication (HS256). Real deployments override these values through the environment;
# the dummy default secret is for local development and tests only (must be >= 32 bytes).
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-that-is-long-enough-for-hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# OCPP web socket server accepting the charge points' connections. Each value can be overridden
# with the WEBSOCKET_URL, WEBSOCKET_PORT and FINAL_WS_SERVER_ADDRESS environment variables;
# see application-local.yml for ready-to-use local defaults.
websocket:
  url: ${WEBSOCKET_URL:}
  port: ${WEBSOCKET_PORT:}
  final-server-address: ${FINAL_WS_SERVER_ADDRESS:}
