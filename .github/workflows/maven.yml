# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed byy
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev"  ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  # Needed to post/update the coverage comment on pull requests
  pull-requests: write

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests and generate coverage report
        env:
          POSTGRESQL_DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          POSTGRESQL_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          POSTGRESQL_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FINAL_WS_SERVER_ADDRESS: ${{ secrets.FINAL_WS_SERVER_ADDRESS }}
          WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
          WEBSOCKET_PORT: ${{ secrets.WEBSOCKET_PORT }}
        run: |
          echo "Process Check Style..."
          mvn validate
          echo "Running tests with JaCoCo coverage..."
          mvn verify
      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          # Aggregate (all modules) lives in the dedicated coverage-report module;
          # per-module reports are under each module's target/site/jacoco/.
          path: |
            coverage-report/target/site/jacoco-aggregate/
            */target/site/jacoco/
          retention-days: 14
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          # Public repo: no token required. For reliability (rate limits), add a
          # CODECOV_TOKEN repository secret and uncomment the line below:
          # token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-report/target/site/jacoco-aggregate/jacoco.xml
          flags: unit
          fail_ci_if_error: false
      - name: Extract coverage percentages from JaCoCo XML
        if: always()
        id: coverage
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage-report/target/site/jacoco-aggregate/jacoco.xml')
          counters = {c.get('type'): c for c in tree.getroot().findall('counter')}
          def pct(c):
              covered = int(c.get('covered')); missed = int(c.get('missed'))
              return round(covered / (covered + missed) * 100, 1) if covered + missed else 0.0
          for name in ('INSTRUCTION', 'LINE', 'BRANCH', 'METHOD'):
              print(f\"{name.lower()}={pct(counters[name])}\")
          " >> \"$GITHUB_OUTPUT\"
      - name: Write coverage to job summary
        if: always()
        run: |
          cat >> \"$GITHUB_STEP_SUMMARY\" << EOF
          ## Code Coverage (JaCoCo aggregate)
          | Metric | Coverage |
          |---|---|
          | Instructions | ${{ steps.coverage.outputs.instruction }}% |
          | Lines | ${{ steps.coverage.outputs.line }}% |
          | Branches | ${{ steps.coverage.outputs.branch }}% |
          | Methods | ${{ steps.coverage.outputs.method }}% |
          EOF
