# Test configuration: in-memory H2 in PostgreSQL compatibility mode, mirroring the "local"
# profile (service/src/main/resources/application-local.yml), so the PostgreSQL-specific
# column definitions of the entities (text, timestamp default ..., boolean default ...) are
# accepted by Hibernate DDL.
spring:
  datasource:
    url: jdbc:h2:mem:ocpp-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
